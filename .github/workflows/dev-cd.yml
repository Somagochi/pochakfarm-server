name: dev-cd

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "image=$REGISTRY/$REPOSITORY:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve ECR pull password
        id: ecr-pw
        run: |
          PASSWORD=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml, deploy/nginx/conf.d/default.conf, deploy/scripts/deploy.sh, deploy/promtail/config.yml"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Blue-green deploy on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-pw.outputs.password }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          LOKI_URL: ${{ secrets.DEV_LOKI_URL }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,REGISTRY,ECR_PASSWORD,DEPLOY_PATH,LOKI_URL
          command_timeout: 20m
          script: |
            set -e
            export SPRING_PROFILES_ACTIVE=dev
            bash "$DEPLOY_PATH/scripts/deploy.sh"
