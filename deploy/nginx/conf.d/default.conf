# 활성 색상(app-blue/app-green)을 가리키는 upstream 은 deploy 스크립트가
# conf.d/upstream.conf 로 생성/교체하며, nginx reload 로 트래픽을 전환한다.

server {
    listen 80;
    server_name _;

    # 프록시 자체 헬스체크 (외부에서 nginx 생존 확인용)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api {
        proxy_pass http://pochakfarm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Swagger UI / OpenAPI 문서 (springdoc 기본 경로)
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://pochakfarm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
