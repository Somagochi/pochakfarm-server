server {
    listen 80;
    server_name _;

    # 프록시 자체 헬스체크 (외부에서 nginx 생존 확인용)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api {
        proxy_pass http://pochakfarm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Swagger UI / OpenAPI 문서 (springdoc 기본 경로)
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://pochakfarm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 같은 VPC 사설망에서만 접근 허용(외부 차단)
    location /actuator {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://pochakfarm_actuator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
