server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: pochakfarm-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: pochakfarm
          color: blue
          __path__: /logs/blue/pochakfarm-app*.json

      - targets:
          - localhost
        labels:
          job: pochakfarm
          color: green
          __path__: /logs/green/pochakfarm-app*.json

    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            thread: thread_name
            message: message
            timestamp: '"@timestamp"'

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - labels:
          level: