services:
  mysql:
    image: mysql:8.4
    container_name: pochakfarm-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pochakfarm
      MYSQL_USER: pochak
      MYSQL_PASSWORD: pochak
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - pochakfarm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: pochakfarm-local-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pochakfarm-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4
    container_name: pochakfarm-local-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - pochakfarm-localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep '\"s3\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pochakfarm-mysql-data:
  pochakfarm-valkey-data:
  pochakfarm-localstack-data:
