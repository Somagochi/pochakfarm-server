spring:
  profiles:
    active: local
  config:
    import: optional:classpath:secret/
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB
  datasource:
    url: ${secret.datasource.url}
    username: ${secret.datasource.username}
    password: ${secret.datasource.password}
    driver-class-name: ${secret.datasource.driver-class-name}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${secret.jpa.hibernate.ddl-auto}
    show-sql: ${secret.jpa.show-sql}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${secret.jpa.properties.hibernate.format_sql}
  data:
    redis:
      host: ${secret.data.redis.host}
      username: ${secret.data.redis.username}
      password: ${secret.data.redis.password}
      port: ${secret.data.redis.port}
      ssl:
        enabled: ${secret.data.redis.ssl.enabled}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${secret.social.kakao.client-id}
            client-secret: ${secret.social.kakao.client-secret}
            redirect-uri: ${secret.social.kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${secret.social.naver.client-id}
            client-secret: ${secret.social.naver.client-secret}
            redirect-uri: ${secret.social.naver.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - email
            client-name: Naver
          apple:
            client-id: ${secret.social.apple.client-id}
            client-secret: ${secret.social.apple.client-secret}
            redirect-uri: ${secret.social.apple.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - email
            client-name: Apple
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-name-attribute: response
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: pochakfarm

springdoc:
  api-docs:
    enabled: ${secret.springdoc.api-docs.enabled}
  swagger-ui:
    enabled: ${secret.springdoc.swagger-ui.enabled}

app:
  discord:
    webhook-url: ${secret.discord.webhook-url:}
  jwt:
    secret: ${secret.jwt.secret}
    access-token-expiration: ${secret.jwt.access-token-expiration}
    refresh-token-expiration: ${secret.jwt.refresh-token-expiration}
  social:
    kakao:
      base-url: https://kapi.kakao.com
      user-info-path: /v2/user/me
    naver:
      base-url: https://openapi.naver.com
      user-info-path: /v1/nid/me
    apple:
      issuer: https://appleid.apple.com
      jwks-uri: https://appleid.apple.com/auth/keys
      audience: ${secret.social.apple.audience}
    oidc:
      jwks-cache:
        ttl: ${secret.social.oidc.jwks-cache.ttl}
        min-refresh-interval: ${secret.social.oidc.jwks-cache.min-refresh-interval}
  pre-registration:
    enabled: ${secret.pre-registration.enabled:true}
    crypto:
      encryption-key: ${secret.pre-registration.crypto.encryption-key}
      hash-key: ${secret.pre-registration.crypto.hash-key}
  characterization:
    device-limit-enabled: ${secret.characterization.device-limit-enabled:false}
  characterizer:
    base-url: ${secret.characterizer.base-url:http://localhost:8000}
    connect-timeout: ${secret.characterizer.connect-timeout:PT5S}
    read-timeout: ${secret.characterizer.read-timeout:PT6M}
  storage:
    s3:
      bucket: ${secret.storage.s3.bucket:pochakfarm-local}
      region: ${secret.storage.s3.region:ap-northeast-2}
      access-key: ${secret.storage.s3.access-key:}
      secret-key: ${secret.storage.s3.secret-key:}
      presign-expiration: ${secret.storage.s3.presign-expiration:PT5M}
      max-file-size: ${secret.storage.s3.max-file-size:10485760}
      allowed-content-types: ${secret.storage.s3.allowed-content-types:image/jpeg,image/png,image/webp}
