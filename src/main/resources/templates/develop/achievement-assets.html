<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업적 에셋 관리 (dev)</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; margin: 32px auto; max-width: 980px; padding: 0 16px; background: #f6f7f9; color: #1f2328; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #57606a; font-size: 13px; margin-bottom: 20px; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .flash.ok { background: #dafbe1; color: #116329; }
    .flash.fail { background: #ffebe9; color: #cf222e; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; overflow: hidden; }
    .card-header { padding: 14px 18px; border-bottom: 1px solid #eaeef2; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .card-header .title { font-size: 16px; font-weight: 700; }
    .code { font-family: ui-monospace, monospace; font-size: 13px; color: #0969da; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .badge.hidden-badge { background: #24292f; color: #fff; }
    .badge.category { background: #ddf4ff; color: #0969da; }
    .desc { color: #57606a; font-size: 12px; }
    .card-header .target { margin-left: auto; color: #57606a; font-size: 12px; }
    .section { padding: 14px 18px; border-bottom: 1px solid #eaeef2; }
    .section:last-child { border-bottom: none; }
    .section-title { font-size: 12px; color: #57606a; font-weight: 700; margin-bottom: 10px; }
    .asset-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .asset-cell { display: flex; align-items: center; gap: 10px; }
    .asset-cell .label { font-size: 12px; color: #57606a; width: 52px; }
    .preview { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; background: #f0f2f5; border: 1px solid #eaeef2; display: block; }
    .no-image { width: 64px; height: 64px; border-radius: 8px; background: #f0f2f5; border: 1px dashed #c4ccd4; color: #8b949e; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    input[type="file"] { font-size: 12px; max-width: 200px; }
    input[type="number"] { width: 110px; padding: 6px 8px; border: 1px solid #c4ccd4; border-radius: 6px; font-size: 13px; }
    button { background: #1f883d; color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
    button:hover { background: #1a7f37; }
    button:disabled { background: #8b949e; cursor: progress; }
    .reward-row { display: flex; align-items: center; gap: 14px; padding: 8px 0; border-top: 1px dashed #eaeef2; flex-wrap: wrap; }
    .reward-row:first-of-type { border-top: none; }
    .reward-type { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .reward-type.coin { background: #fff8c5; color: #7d4e00; }
    .reward-type.experience { background: #e6f0ff; color: #0550ae; }
    .reward-type.badge-type { background: #ffeff7; color: #bf3989; }
    .reward-form { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
<h1>업적 에셋 관리 (dev)</h1>
<p class="sub">업적별 미달성/달성 이미지와 하위 보상(코인/경험치 수치, 뱃지 아이콘)을 관리한다. 이미지는 presigned 업로드로 교체된다. (png / jpeg / webp)</p>

<div class="flash ok" th:if="${message}" th:text="${message}"></div>
<div class="flash fail" th:if="${error}" th:text="${error}"></div>
<div class="flash fail" id="upload-error" hidden></div>

<div class="card" th:each="achievement : ${achievements}">
  <div class="card-header">
    <span class="code" th:text="${achievement.code}"></span>
    <span class="title" th:text="${achievement.title}"></span>
    <span class="badge category" th:text="${achievement.category}"></span>
    <span class="badge hidden-badge" th:if="${achievement.hidden}">숨김</span>
    <span class="desc" th:text="${achievement.description}"></span>
    <span class="target" th:text="'목표 ' + ${achievement.targetValue}"></span>
  </div>

  <div class="section">
    <div class="section-title">업적 이미지</div>
    <form class="image-form" th:action="@{/api/dev/achievements/{id}/images(id=${achievement.id})}" method="post">
      <div class="asset-row">
        <div class="asset-cell">
          <span class="label">미달성</span>
          <img class="preview" th:if="${achievement.unachievedImageUrl}" th:src="${achievement.unachievedImageUrl}" alt="미달성 이미지">
          <div class="no-image" th:unless="${achievement.unachievedImageUrl}">없음</div>
          <input type="file" data-role="unachieved" accept="image/png,image/jpeg,image/webp">
        </div>
        <div class="asset-cell">
          <span class="label">달성</span>
          <img class="preview" th:if="${achievement.achievedImageUrl}" th:src="${achievement.achievedImageUrl}" alt="달성 이미지">
          <div class="no-image" th:unless="${achievement.achievedImageUrl}">없음</div>
          <input type="file" data-role="achieved" accept="image/png,image/jpeg,image/webp">
        </div>
        <input type="hidden" name="unachievedImageKey">
        <input type="hidden" name="unachievedImageContentType">
        <input type="hidden" name="achievedImageKey">
        <input type="hidden" name="achievedImageContentType">
        <button type="submit">이미지 저장</button>
      </div>
    </form>
  </div>

  <div class="section">
    <div class="section-title">보상</div>
    <div class="reward-row" th:each="reward : ${achievement.rewards}">
      <th:block th:if="${reward.isBadge()}">
        <span class="reward-type badge-type">BADGE</span>
        <form class="reward-form badge-form" th:action="@{/api/dev/achievements/rewards/{id}/badge-image(id=${reward.id})}" method="post">
          <img class="preview" th:if="${reward.badgeImageUrl}" th:src="${reward.badgeImageUrl}" alt="뱃지 아이콘">
          <div class="no-image" th:unless="${reward.badgeImageUrl}">없음</div>
          <span class="desc" th:text="${reward.badgeCode} + ' · ' + ${reward.badgeName}"></span>
          <input type="file" data-role="badge" accept="image/png,image/jpeg,image/webp">
          <input type="hidden" name="badgeImageKey">
          <input type="hidden" name="badgeImageContentType">
          <button type="submit">아이콘 저장</button>
        </form>
      </th:block>
      <th:block th:unless="${reward.isBadge()}">
        <span class="reward-type" th:classappend="${reward.rewardType.name() == 'COIN'} ? 'coin' : 'experience'" th:text="${reward.rewardType}"></span>
        <form class="reward-form" th:action="@{/api/dev/achievements/rewards/{id}/amount(id=${reward.id})}" method="post">
          <input type="number" name="amount" min="1" th:value="${reward.amount}">
          <button type="submit">수치 저장</button>
        </form>
      </th:block>
    </div>
    <div class="desc" th:if="${#lists.isEmpty(achievement.rewards)}">보상 없음</div>
  </div>
</div>

<script>
  const errorBox = document.getElementById('upload-error');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  async function presignAndPut(file, target) {
    const presignResponse = await fetch('/api/dev/achievements/presign', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contentType: file.type, target: target})
    });
    if (!presignResponse.ok) {
      throw new Error('presign 발급 실패 (' + presignResponse.status + ')');
    }
    const presign = (await presignResponse.json()).data;
    const putResponse = await fetch(presign.uploadUrl, {
      method: 'PUT',
      headers: {'Content-Type': file.type},
      body: file
    });
    if (!putResponse.ok) {
      throw new Error('S3 업로드 실패 (' + putResponse.status + ')');
    }
    return presign.key;
  }

  function lockButton(button) {
    button.disabled = true;
    button.dataset.originalText = button.textContent;
    button.textContent = '업로드 중…';
  }

  function unlockButton(button) {
    button.disabled = false;
    button.textContent = button.dataset.originalText;
  }

  document.querySelectorAll('.image-form').forEach(form => {
    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorBox.hidden = true;
      const button = form.querySelector('button');
      lockButton(button);
      try {
        for (const role of ['unachieved', 'achieved']) {
          const fileInput = form.querySelector('input[data-role="' + role + '"]');
          const file = fileInput && fileInput.files[0];
          if (!file) {
            continue;
          }
          const key = await presignAndPut(file, 'achievement');
          form.querySelector('input[name="' + role + 'ImageKey"]').value = key;
          form.querySelector('input[name="' + role + 'ImageContentType"]').value = file.type;
        }
        form.submit();
      } catch (e) {
        showError(e.message);
        unlockButton(button);
      }
    });
  });

  document.querySelectorAll('.badge-form').forEach(form => {
    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorBox.hidden = true;
      const button = form.querySelector('button');
      const fileInput = form.querySelector('input[data-role="badge"]');
      const file = fileInput && fileInput.files[0];
      if (!file) {
        showError('교체할 뱃지 아이콘 파일을 선택하세요.');
        return;
      }
      lockButton(button);
      try {
        const key = await presignAndPut(file, 'badge');
        form.querySelector('input[name="badgeImageKey"]').value = key;
        form.querySelector('input[name="badgeImageContentType"]').value = file.type;
        form.submit();
      } catch (e) {
        showError(e.message);
        unlockButton(button);
      }
    });
  });
</script>
</body>
</html>
