<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POCHAKFARM</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="포착팜" />
    <meta property="og:description" content="우리 동물은 어떤 타입 카드일까?" />
    <meta property="og:image" th:if="${imageUrl != null}" th:attr="content=${imageUrl}" />
    <meta property="og:url" th:attr="content=${pageUrl}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="포착팜" />
    <meta name="twitter:description" content="우리 동물은 어떤 타입 카드일까?" />
    <meta name="twitter:image" th:if="${imageUrl != null}" th:attr="content=${imageUrl}" />

    <script th:inline="javascript">
      /*<![CDATA[*/
      window.location.replace(/*[[${redirectUrl}]]*/ "");
      /*]]>*/
    </script>
  </head>
  <body>
    <main>
      <h1>포착팜</h1>
      <p>변환 결과</p>
      <img th:if="${imageUrl != null}" th:src="${imageUrl}" alt="pochakfarm" style="max-width: 100%" />
    </main>
  </body>
</html>
