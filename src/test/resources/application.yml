app:
  jwt:
    secret: 12345678901234567890123456789012
    access-token-expiration: 1h
    refresh-token-expiration: 336h
  social:
    kakao:
      base-url: https://kapi.kakao.com
      user-info-path: /v2/user/me
    naver:
      base-url: https://openapi.naver.com
      user-info-path: /v1/nid/me
    apple:
      issuer: https://appleid.apple.com
      jwks-uri: https://appleid.apple.com/auth/keys
      audience: com.somagochi.pochakfarm
    oidc:
      jwks-cache:
        ttl: 6h
        min-refresh-interval: 5m
